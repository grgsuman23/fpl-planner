name: Update FPL data

on:
  schedule:
    # Every 4 hours (UTC). Kathmandu = UTC+5:45, so roughly 05:32, 09:32, 13:32, 17:32, 21:32, 01:32 NPT.
    - cron: "47 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.json", "engine/**"]

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run model and optimiser
        env:
          FPL_TEAM_IDS: ${{ vars.FPL_TEAM_IDS }}
        run: node engine/run.mjs
      - name: Commit results
        run: |
          git config user.name "fpl-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done; exit 1
